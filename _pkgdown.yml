url: https://tony2015116.github.io/tidypptsda/
template:
  #light-switch: true
  #bootstrap: 5
  bootswatch: cosmo
  theme: arrow-dark
  #theme: breeze-light
  #theme-dark: arrow-dark
navbar:
  bg: light
  structure:
    left:  [reference, articles]
    right: [github, lightswitch]

  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/tony2015116/tidypptsda
      aria-label: GitHub

reference:
- title: Quality-control settings
  desc: Set every threshold of the pipeline in one object, starting from one of three presets.
  contents:
  - qc_config
- title: Read and prepare station data
  desc: Read NEDAP or FIRE exports (many files or a folder) and turn them into one standard visit table.
  contents:
  - read_station
  - prep_visits
- title: Body weight and daily gain
  desc: Flag implausible body weights, then fit growth curves and compute ADG over a body weight stage.
  contents:
  - clean_weight
  - calc_adg
- title: Feed intake and feed conversion
  desc: Flag feeder errors, correct and impute daily feed intake, and combine ADG and ADFI into FCR.
  contents:
  - flag_feed_errors
  - calc_adfi
  - calc_fcr
- title: Whole pipeline
  desc: Run every step in a row with one set of QC settings and keep all intermediate results.
  contents:
  - run_pipeline
- title: Plots
  desc: One plot per station and one panel per pig; write them to files.
  contents:
  - plot_adg
  - plot_adfi
  - save_plots
- title: Example data
  desc: Raw exports from NEDAP and FIRE stations, used in every example.
  contents:
  - nedap
  - fire

articles:
- title: Get started
  navbar: ~
  contents:
  - get-started
- title: 中文文档
  navbar: 中文文档
  contents:
  - tidypptsda-zh
  - qc-parameters-zh
  - qc-presets-zh
