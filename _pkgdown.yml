url: https://tony2015116.github.io/tidypptsda/
template:
  #light-switch: true
  #bootstrap: 5
  bootswatch: cosmo
  theme: arrow-dark
  #theme: breeze-light
  #theme-dark: arrow-dark
navbar:
  bg: light
  structure:
    left:  [getstarted, reference, articles, cheatsheet, news]
    right: [github, lightswitch]

  components:
    getstarted:
      text: Get started
      href: articles/get-started.html
    cheatsheet:
      text: 速查表 / Cheatsheet
      menu:
      - text: 中文
        href: cheatsheet.html
      - text: English
        href: cheatsheet-en.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/tony2015116/tidypptsda
      aria-label: GitHub

reference:
- title: Quality-control settings
  desc: Set every threshold of the pipeline in one object; override single parameters.
  contents:
  - qc_config
  - fiv_max_example
- title: Read and prepare station data
  desc: Read NEDAP or FIRE exports (many files or a folder), turn them into one standard visit table and add breed information.
  contents:
  - read_station
  - station_format
  - prep_visits
  - add_breed
- title: Body weight and daily gain
  desc: Flag implausible body weights, fill the missing daily weights of the stage and compute ADG as the slope of the daily weights.
  contents:
  - clean_weight
  - calc_adg
- title: Feed intake and feed conversion
  desc: Flag feeder errors, correct and impute daily feed intake, and combine ADG and ADFI into FCR.
  contents:
  - flag_feed_errors
  - calc_adfi
  - calc_fcr
- title: Whole pipeline
  desc: Run every step in a row with one set of QC settings and keep all intermediate results.
  contents:
  - run_pipeline
- title: Export
  desc: Write all result tables to CSV files for the testing station, or an HTML report to browse station by station.
  contents:
  - write_results
  - write_report
- title: Validation
  desc: Check the outlier methods, growth curve models, weight fill and feed intake imputation on your own data, by spoiling or hiding part of it on purpose.
  contents:
  - validate_outliers
  - validate_adg
  - validate_weight_fill
  - validate_adfi
  - validate_truncation
- title: Plots
  desc: One plot per station and one panel per pig; write them to files.
  contents:
  - plot_adg
  - plot_adfi
  - save_plots
- title: Example data
  desc: Raw exports from NEDAP and FIRE stations, used in every example.
  contents:
  - nedap
  - fire

articles:
- title: 中文文档
  navbar: 中文文档
  contents:
  - tidypptsda-zh
  - design-zh
  - qc-parameters-zh
  - methods-zh
  - fill-zh
  - validation-zh
  - output-zh
- title: internal
  contents:
  - get-started

news:
  one_page: true
